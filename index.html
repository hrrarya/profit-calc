<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Profit Calculator</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --profit: #22c55e;
      --loss: #ef4444;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .sub {
      margin: 0 0 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .result {
      margin-top: 0.5rem;
      padding: 1rem;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .result-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .result-value.profit {
      color: var(--profit);
    }
    .result-value.loss {
      color: var(--loss);
    }
    .result-value.neutral {
      color: var(--muted);
    }
    .error {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      color: var(--loss);
    }
    .formula {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
    code {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      display: block;
      margin-top: 0.35rem;
      padding: 0.5rem;
      background: var(--bg);
      border-radius: 6px;
      overflow-x: auto;
    }
    .copyright {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.65;
    }
    .copyright a {
      color: var(--accent);
      text-decoration: none;
    }
    .copyright a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Profit calculator</h1>
    <p class="sub">Enter invested amount, current price per unit, and your target price.</p>
    <form id="calc-form" novalidate>
      <label for="invested">Invested amount</label>
      <input id="invested" name="invested" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 1000" required />
      <label for="current">Current price (per unit)</label>
      <input id="current" name="current" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 50" required />
      <label for="target">Target price (per unit)</label>
      <input id="target" name="target" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 65" required />
    </form>
    <div class="result" aria-live="polite">
      <div class="result-label">Profit / loss</div>
      <div id="profit-display" class="result-value neutral">—</div>
    </div>
    <div id="error-msg" class="error" hidden></div>
    <p class="formula">
      Formula:<br />
      <code>((invested_amount ÷ current_price) × target_price) − invested_amount = profit</code>
    </p>
    <footer class="copyright">
      © <span id="cpy-year"></span> Made by Hridoy Mozumder.<br />
      <a href="https://github.com/hrrarya" target="_blank" rel="noopener noreferrer">GitHub: hrrarya</a>
    </footer>
  </div>
  <script>
    (function () {
      document.getElementById("cpy-year").textContent = new Date().getFullYear();
      const investedEl = document.getElementById("invested");
      const currentEl = document.getElementById("current");
      const targetEl = document.getElementById("target");
      const profitDisplay = document.getElementById("profit-display");
      const errorMsg = document.getElementById("error-msg");

      function parseNum(el) {
        const v = el.value.trim();
        if (v === "") return NaN;
        return Number(v);
      }

      function formatMoney(n) {
        return n.toLocaleString(undefined, {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      function recalc() {
        const invested = parseNum(investedEl);
        const current = parseNum(currentEl);
        const target = parseNum(targetEl);

        errorMsg.hidden = true;
        errorMsg.textContent = "";

        if ([invested, current, target].some((x) => Number.isNaN(x))) {
          profitDisplay.textContent = "—";
          profitDisplay.className = "result-value neutral";
          return;
        }

        if (invested < 0 || current < 0 || target < 0) {
          errorMsg.textContent = "Values must be zero or positive.";
          errorMsg.hidden = false;
          profitDisplay.textContent = "—";
          profitDisplay.className = "result-value neutral";
          return;
        }

        if (current === 0) {
          errorMsg.textContent = "Current price cannot be zero (cannot divide by zero).";
          errorMsg.hidden = false;
          profitDisplay.textContent = "—";
          profitDisplay.className = "result-value neutral";
          return;
        }

        const profit = (invested / current) * target - invested;

        profitDisplay.textContent = (profit >= 0 ? "+" : "") + formatMoney(profit);
        profitDisplay.className =
          "result-value " + (profit > 0 ? "profit" : profit < 0 ? "loss" : "neutral");
      }

      [investedEl, currentEl, targetEl].forEach((el) => {
        el.addEventListener("input", recalc);
        el.addEventListener("change", recalc);
      });
    })();
  </script>
</body>
</html>
