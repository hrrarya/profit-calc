<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Profit Calculator</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="card" id="app">
    <div id="header-section"></div>
    <p class="sub">Create coin instances, track multiple entries, and see live P/L at current and target prices.</p>
    <div id="create-section"></div>
    <div id="history-section"></div>
    <div id="active-section"></div>
    <div id="settings-modal" class="modal-overlay hidden" aria-hidden="true"></div>
    <div id="dialog-modal" class="modal-overlay hidden" aria-hidden="true"></div>
    <p class="formula">
      Formula:<br />
      <code>((invested ÷ entry_price) × price) − invested = profit</code>
    </p>
    <footer class="copyright">
      © <span id="cpy-year"></span> Made by Hridoy Mozumder.<br />
      <a href="https://github.com/hrrarya" target="_blank" rel="noopener noreferrer">GitHub: hrrarya</a>
    </footer>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
